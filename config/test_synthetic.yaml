# Synthetic test configuration — runs locally, no cluster data needed.
#
#   python test/synthetic/make_fixture.py
#   snakemake --snakefile workflow/Snakefile --configfile config/test_synthetic.yaml \
#       --cores 2 test/synthetic/results/merged.h5ad
#
# See test/synthetic/README.md. Ground truth for every barcode is in
# test/synthetic/data/truth/<capture>.csv.

deps:
  cellranger: "test/synthetic/data/cellranger"
  captures: "test/synthetic/data/captures.csv"
  samples: "test/synthetic/data/samples.csv"
  demux: "test/synthetic/data/demux"
  annotation: "test/synthetic/data/annotation"

outs:
  results: "test/synthetic/results"
  logs: "test/synthetic/logs"

params:
  modality: "auto"
  make_seurat: false
  # Scrublet's automatic threshold is unstable on ~750 cells; pin it.
  scrublet_threshold: 0.25

# Lineage labels, pre-trained toy model (python test/synthetic/make_lineage_model.py):
#   params: {lineages: {enabled: true, model: "test/synthetic/data/lineage_model"}}
# or trained in the run from the toy reference that script writes:
#   params: {lineages: {enabled: true, train: {reference:
#     "test/synthetic/data/lineage_reference.h5ad", major_key: major, fine_key: fine,
#     gene_id_key: gene_ids, n_genes: 200, n_markers: 20, version: synthetic-v1}}}
