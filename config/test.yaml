# Test configuration for mkobj workflow
# Used with run_test.sh for standalone testing
#
# Test data: two small captures (NeoMet_Pool_012_1, NeoMet_Pool_012_2)
# imported via `dvc import` from swarbricklab/neochemo.

deps:
  cellranger: "test/data/cellranger"
  captures: "test/data/captures.csv"
  demux: "test/data/demux"
  annotation: "test/data/annotation"
  ambient: "test/data/ambient"

outs:
  results: "test/results"
  logs: "test/logs"

params:
  modality: "auto"

# Exercises the schema 7.1.0 formatting path. No metadata joins here — the test
# data has no clinical metadata, so most ontology fields land on "unknown",
# which is what the schema expects when a value is genuinely unavailable.
cellxgene:
  defaults:
    suspension_type: "cell"
    tissue_type: "tissue"
    is_primary_data: true
    donor_id: "pooled"
  uns:
    organism_ontology_term_id: "NCBITaxon:9606"
    title: "mkobj test — NeoMet_Pool_012"  # no subsets here, so no {subset}
