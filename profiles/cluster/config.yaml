# Cluster profile for mkobj (Snakemake 8+)
# Platform-specific settings (project, volumes, bind mounts) are handled by qxub

# Executor settings
executor: cluster-generic
cluster-generic-submit-cmd: >-
  qxub exec --terse
  --name {rule}.{jobid}
  --mem {resources.mem_mb}M
  --cpus {threads}
  --time {resources.runtime}m
  --log-dir logs/joblogs/mkobj
  --tags workflow={resources.workflow},rule={rule}
cluster-generic-status-cmd: "qxtat check --snakemake --log-dir logs/joblogs/mkobj"
cluster-generic-cancel-cmd: "qdel"

# Software deployment
software-deployment-method: [conda, apptainer]

# Build conda envs in the shared a56 cache rather than ./.snakemake/conda, so
# every dataset repo using mkobj reuses one copy instead of building its own
# (the seurat env alone is ~1.8 GB).
#
# This matches the sibling workflows, which set it in their own NCI profiles:
#   snp_demux              profiles/global/nci/config.yaml
#   chromium-preprocessing profiles/global/nci/config.yaml
#
# Note XDG_CONFIG_DIRS does not supply this: there is no `snakemake/` directory
# under /g/data/a56/config/xdg, and passing `--profile <path>` (as run_mod.sh
# does) bypasses XDG profile lookup regardless.
conda-prefix: /g/data/a56/conda/snakecache/

# Job scheduling
jobs: 1000
max-status-checks-per-second: 10
latency-wait: 60
local-cores: 1

# General settings
keep-going: True
rerun-incomplete: True
retries: 0

# Default resources (can be overridden per-rule below)
default-resources:
  workflow: mkobj
  runtime: 600
  mem_mb: 4000
  threads: 1
  disk_mb: 100

# Per-rule resource overrides
set-resources:
  create_seurat_object:
    threads: 1
    mem_mb: 8000
    runtime: 30
  merge_captures:
    threads: 16
    mem_mb: 190000
    runtime: 120
  create_anndata_object:
    threads: 1
    mem_mb: 8000
    runtime: 30
  merge_anndata_captures:
    threads: 16
    mem_mb: 190000
    runtime: 120
  detect_doublets:
    threads: 4
    mem_mb: 32000
    runtime: 60
  process_merged_anndata:
    threads: 16
    mem_mb: 190000
    runtime: 240
  format_cellxgene:
    threads: 2
    mem_mb: 32000
    runtime: 60
